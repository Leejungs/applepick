upstream api {
    server api:50000;
}

server {
    listen 80;
    listen [::]:80;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite 빌드 결과물 (파일명에 해시 포함)
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI 어시스턴트 SSE 스트리밍 (버퍼링 끄기)
    location /api/ai/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 크롤러 전용 API 는 외부에서 막는다 (크롤러는 내부망 api:50000 으로 직접 호출)
    location ~ ^/api/notification/(list|remove) {
        return 403;
    }

    # Swagger 문서
    location ~ ^/(docs|flask-apispec) {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }
}
